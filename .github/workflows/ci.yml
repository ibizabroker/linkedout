name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Compile
        run: bun run compile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check the build leaves out the tracker
        run: jq -e '(has("key") or has("oauth2") or (.permissions | index("identity"))) | not' .output/chrome-mv3/manifest.json

      - name: Build with the tracker
        env:
          WXT_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          WXT_EXTENSION_KEY: ci-placeholder
        run: bun run build

      - name: Check the build includes the tracker
        run: jq -e '.key and .oauth2.client_id and (.oauth2.scopes == ["https://www.googleapis.com/auth/drive.file"]) and (.permissions | index("identity")) and (.permissions | index("alarms"))' .output/chrome-mv3/manifest.json
