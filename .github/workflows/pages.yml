name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'entrypoints/**'
      - 'lib/**'
      - 'components/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/site

      - id: deployment
        uses: actions/deploy-pages@v5
